name: CI


# by not building all branches on push, we avoid the duplicated builds in PRs
on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:

  schedule:
    - cron: '0 2 * * *'

env:
  NUMBA_NUM_THREADS: 1
  MPLBACKEND: Agg
  PYTEST_ADDOPTS: --color=yes
  CTAPIPE_IO_ZFITS_NO_SERVICE_DATA: 1


jobs:
  static-code-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --files $(git diff origin/main --name-only)

  tests:
    continue-on-error: ${{ matrix.ctapipe-ref == 'main' }}
    strategy:
      matrix:
        include:
          - python-version: "3.13"
            os: ubuntu-latest
            ctapipe: "0.28.0"

          - python-version: "3.12"
            os: ubuntu-latest
            ctapipe: "0.29.0"

          - python-version: "3.14"
            os: ubuntu-latest
            ctapipe: "0.30.0"

          - python-version: "3.12"
            os: ubuntu-latest
            extra-args: ['codecov']
            ctapipe: "0.31.0"

          - python-version: "3.13"
            os: ubuntu-latest
            ctapipe-ref: "main"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Update pip
        run: |
          python -m pip install --upgrade pip

      - name: Build the package
        run: |
          pip install build
          python -m build

      - name: Install the package
        run: pip install .[test]

      - name: Install the package in editable mode
        run: |
          pip install --editable .[test] setuptools_scm
          if [ -n "${{ matrix.ctapipe-ref }}" ]; then
            pip install git+https://github.com/cta-observatory/ctapipe.git@${{ matrix.ctapipe-ref }}
          else
            pip install ctapipe==${{ matrix.ctapipe }}
          fi

      - name: Setup coverage
        if: contains(matrix.extra-args, 'codecov')
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          # coverage options
          echo "COVERAGE_CORE=sysmon" >> $GITHUB_ENV
          echo "NUMBA_JIT_COVERAGE=1" >> $GITHUB_ENV
          echo "PYTEST_ADDOPTS=--cov --cov-report=xml $PYTEST_ADDOPTS" >> $GITHUB_ENV

          # sonar workflow env
          echo "PR_NUMBER=${PR_NUMBER}" >> sonar_env
          echo "SOURCE_REPOSITORY=${SOURCE_REPOSITORY}" >> sonar_env
          echo "SOURCE_BRANCH=${SOURCE_BRANCH}" >> sonar_env
          echo "TARGET_BRANCH=${TARGET_BRANCH}" >> sonar_env
          echo "PROJECT_VERSION=$(python -m setuptools_scm)" >> sonar_env
          cat sonar_env

      - name: Test with pytest
        run: |
          pytest \
            --doctest-modules \
            --ignore-glob="*/_dev_version" \
            -v

      # upload coverage report for sonar workflow
      - uses: actions/upload-artifact@v7
        if: contains(matrix.extra-args, 'codecov')
        with:
          name: coverage-report
          path: |
            coverage.xml
            sonar_env

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install doc dependencies
        run: |
          pip install -e .[docs]
          git describe --tags
          python -c 'import ctapipe_io_zfits ; print(ctapipe_io_zfits.__version__)'

      - name: Build docs
        run: make -C docs html SPHINXOPTS="--keep-going --color --nitpicky --fail-on-warning"
